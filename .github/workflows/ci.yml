name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsystemd-dev libmnl-dev ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEDGE_BUILD_TESTS=ON \
            -DEDGE_ENABLE_SANITIZERS=ON \
            -DEDGE_FETCH_SDBUSCPP=ON

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j $(nproc)

      - name: Install Python deps
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install jsonschema

      - name: Ensure /tmp output dir
        run: mkdir -p /tmp/edge-healthd

      - name: Produce snapshot
        run: ./build/edge-healthd -c config/local.conf.example --once

      - name: Validate snapshot against schema
        run: python3 scripts/validate_schema.py /tmp/edge-healthd/state.json

      - name: Validate all mock fixtures against schema
        run: |
          set -e
          for f in web/mock/sample_states/*.json; do
            echo "validating $f"
            python3 scripts/validate_schema.py "$f"
          done

  # Lint, test, build, and size-check the optional Preact/TypeScript web UI, so UI
  # changes and dependency bumps get real signal (build-and-validate only covers
  # the C++ daemon).
  web-ui-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Lint (eslint, incl. jsx-a11y)
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      - name: Type-check and build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

  # The Go server that embeds the UI and bridges the WebSocket feed and the
  # snapshot trigger. Its tests cover the middleware chain the browser talks
  # through (a broken WebSocket upgrade otherwise degrades silently to polling).
  web-server-test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: web/server/go.mod
          cache-dependency-path: web/server/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...
