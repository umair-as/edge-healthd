name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsystemd-dev libmnl-dev ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref }}-
            ccache-

      - name: Cache FetchContent deps
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEDGE_BUILD_TESTS=ON \
            -DEDGE_ENABLE_SANITIZERS=ON \
            -DEDGE_FETCH_SDBUSCPP=ON

      - name: Build
        run: cmake --build build -j $(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j $(nproc)

      - name: Install Python deps
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: pip install jsonschema

      - name: Ensure /tmp output dir
        run: mkdir -p /tmp/edge-healthd

      - name: Produce snapshot
        run: ./build/edge-healthd -c config/local.conf.example --once

      - name: Validate snapshot against schema
        run: python3 scripts/validate_schema.py /tmp/edge-healthd/state.json

      - name: Validate all mock fixtures against schema
        run: |
          set -e
          for f in web/mock/sample_states/*.json; do
            echo "validating $f"
            python3 scripts/validate_schema.py "$f"
          done

  # Build the optional Preact/TypeScript web UI so dependency bumps to it get real
  # signal. Without this, an npm PR that breaks `npm run build` (e.g. a Tailwind or
  # Vite major) still passes CI, since build-and-validate only covers the C++ daemon.
  web-ui-build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web/ui
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install (clean, from lockfile)
        run: npm ci

      - name: Type-check and build
        run: npm run build
        # (The `lint` script is not wired yet — eslint is not a declared dependency —
        # so it is intentionally not run here. Build is the signal for dep bumps.)
