name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config \
            libsystemd-dev libmnl-dev python3-dev python3-pip

      - name: Cache FetchContent deps
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: fetchcontent-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: fetchcontent-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DEDGE_BUILD_TESTS=ON \
            -DEDGE_ENABLE_SANITIZERS=ON \
            -DEDGE_FETCH_SDBUSCPP=ON

      - name: Build
        run: cmake --build build -j 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j 2

      - name: Install Python deps
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install jsonschema

      - name: Ensure /tmp output dir
        run: mkdir -p /tmp/edge-healthd

      - name: Produce snapshot
        run: ./build/edge-healthd -c config/local.conf.example --once

      - name: Validate snapshot against schema
        run: python3 scripts/validate_schema.py /tmp/edge-healthd/state.json
