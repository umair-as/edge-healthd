name: CI

on:
  push:
  pull_request:

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential pkg-config libsystemd-dev python3-dev python3-pip

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build -j 2

      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j 2

      - name: Install Python deps
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: python -m pip install --upgrade pip
      - run: pip install jsonschema

      - name: Ensure /tmp output dir
        run: mkdir -p /tmp/edge-healthd

      - name: Produce snapshot
        run: |
          ./build/edge-healthd -c local.conf.example --once || true

      - name: Validate snapshot against schema
        run: python3 scripts/validate_schema.py /tmp/edge-healthd/state.json
