<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system bus policy for edge-healthd.

  The 'edgehealth' service account owns 'edge.health'. Anyone may read the
  OverallSeverity property and introspect, but the management methods
  (TriggerSnapshot, GetRecentLogs, AcknowledgeCrash) are restricted to root and
  members of the 'edge-health-ops' group — GetRecentLogs returns cached journal
  error text, which can contain secrets/PII. If that group does not exist the
  rule matches nobody, so the methods degrade safely to root-only.
-->

<busconfig>

  <!-- Service account: claim the well-known bus name -->
  <policy user="edgehealth">
    <allow own="edge.health"/>
    <allow send_destination="edge.health"/>
    <allow receive_sender="edge.health"/>
  </policy>

  <!-- Operators: root and the edge-health-ops group may call the Manager
       interface methods. -->
  <policy user="root">
    <allow send_destination="edge.health"
           send_interface="edge.health.Manager"/>
  </policy>
  <policy group="edge-health-ops">
    <allow send_destination="edge.health"
           send_interface="edge.health.Manager"/>
  </policy>

  <!-- Everyone: read properties (OverallSeverity) and introspect. The Manager
       interface is intentionally NOT allowed here, so unprivileged callers are
       denied it by the bus default-deny. -->
  <policy context="default">
    <allow send_destination="edge.health"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="edge.health"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

</busconfig>
