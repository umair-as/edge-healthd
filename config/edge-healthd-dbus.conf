<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">

<!--
  D-Bus system bus policy for edge-healthd.

  Grants the 'edgehealth' service account the right to own 'edge.health' and
  allows any process on the system bus to call the Manager interface methods
  and read the standard Properties / Introspectable interfaces.
-->

<busconfig>

  <!-- Service account: claim the well-known bus name -->
  <policy user="edgehealth">
    <allow own="edge.health"/>
    <allow send_destination="edge.health"/>
    <allow receive_sender="edge.health"/>
  </policy>

  <!-- Default: allow clients to call the public interface -->
  <policy context="default">
    <allow send_destination="edge.health"
           send_interface="edge.health.Manager"/>
    <allow send_destination="edge.health"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="edge.health"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>

</busconfig>
